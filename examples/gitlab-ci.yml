# Build and sign your package in your own CI, in your own repository.
#
# This does NOT publish into the community feed, and that is the point: publishing
# would need either the feed's signing key or write access to it, and either one
# would let every contributor publish anything under the feed's name — including a
# higher version of dropbear.
#
# So nothing crosses the boundary. You publish a signed release in your repository.
# The feed notices it within the hour, verifies your signature against the key
# pinned there, adds its own, and indexes it. You never hold the feed's key; the
# feed never holds a token for your repository.
#
# Your signature is not stripped on the way. apk signature blocks are additive, so
# the package a router installs carries both yours and the feed's — a subscriber who
# installs your public key as well can verify you directly.

stages: [build, release]

variables:
  OWFEED_VERSION: "main"

build:
  stage: build
  image: golang:1.25
  services: [docker:dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    # Identity is a hash over the payload, and mkpkg records mtimes. Without a fixed
    # epoch every rebuild produces a new identity for byte-identical content.
    SOURCE_DATE_EPOCH: "1700000000"
  script:
    - go install github.com/VizzleTF/owfeed/cmd/owfeed@${OWFEED_VERSION}
    - ./stage.sh                      # your build: produce the directory to package
    - owfeed lock --update
    - owfeed build
    # Your key, from a masked CI variable. It signs the package; the feed's key will
    # be added later without replacing yours.
    - owfeed sign
    # Everything that can be checked without publishing.
    - owfeed index
    - owfeed doctor --require-origin
    - owfeed smoke
  artifacts:
    paths: [dist/]
    expire_in: 1 day

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Publish the signed packages as release assets. The feed reads them from here.
    - |
      for f in dist/*/*.apk; do
        sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: packages
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"
