name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A package's identity is a hash over its payload, and mkpkg records mtimes. Without
  # a fixed epoch every rebuild produces a new identity for byte-identical content, so
  # each republication ships packages that claim to be new, invalidating every cached
  # copy and making `owfeed verify` report tampering that did not happen.
  #
  # A constant, not a timestamp: identity should depend on what a package contains and
  # on nothing else. Content changes only when a pin changes, and a pin change comes
  # with a version bump.
  SOURCE_DATE_EPOCH: '1700000000'


concurrency:
  group: owfeed-publish
  cancel-in-progress: false

jobs:
  # The build job runs the fetch scripts, which execute code from pull requests.
  # It never sees the signing key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
# owfeed is pinned by commit, not tracked at @main. This repository signs what it
      # publishes; the tool that does the signing should move when someone changes
      # this line, not whenever an unrelated repository is pushed to.
      - run: GOPROXY=direct go install github.com/VizzleTF/owfeed/cmd/owfeed@f98d4059549a663f2a70adb9c00b340f1762bca0

      - name: Fetch upstream artifacts
        run: for d in packages/*/; do ./tools/fetch.sh "$d"; done

      - run: owfeed --frozen-lock build

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A protected environment, so the key is out of reach of anything that runs
    # before a human has looked at it.
    environment: feed
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
# owfeed is pinned by commit, not tracked at @main. This repository signs what it
      # publishes; the tool that does the signing should move when someone changes
      # this line, not whenever an unrelated repository is pushed to.
      - run: GOPROXY=direct go install github.com/VizzleTF/owfeed/cmd/owfeed@f98d4059549a663f2a70adb9c00b340f1762bca0

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Sign, index and check
        env:
          OWFEED_SIGN_KEY: ${{ secrets.OWFEED_SIGN_KEY }}
        run: |
          owfeed sign
          owfeed index
          owfeed smoke
          # Compare what is about to go out against what is already live, before it
          # replaces it. A version republished with different contents is invisible
          # from inside the tree, which is self-consistent either way.
          owfeed verify out || true
          owfeed publish

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
