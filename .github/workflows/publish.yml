name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A package's identity is a hash over its payload, and mkpkg records mtimes. Without
  # a fixed epoch every rebuild produces a new identity for byte-identical content, so
  # each republication ships packages that claim to be new, invalidating every cached
  # copy and making `owfeed verify` report tampering that did not happen.
  #
  # A constant, not a timestamp: identity should depend on what a package contains and
  # on nothing else. Content changes only when a pin changes, and a pin change comes
  # with a version bump.
  SOURCE_DATE_EPOCH: '1700000000'


concurrency:
  group: owfeed-publish
  cancel-in-progress: false

jobs:
  # The build job runs the fetch scripts, which execute code from pull requests.
  # It never sees the signing key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: VizzleTF/owfeed/setup@v0.1.4
        with:
          version: v0.1.4

      - name: Fetch upstream artifacts
        run: for d in packages/*/; do ./tools/fetch.sh "$d"; done

      - run: owfeed --frozen-lock build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A protected environment, so the key is out of reach of anything that runs
    # before a human has looked at it.
    environment: feed
    permissions:
      contents: read
      pages: write
      id-token: write
      # deploy-pages resolves the artifact by id through the Actions API from v4, and
      # a permissions block sets every scope it does not name to none.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: VizzleTF/owfeed/setup@v0.1.4
        with:
          version: v0.1.4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/

      - name: Sign, index and check
        env:
          OWFEED_SIGN_KEY: ${{ secrets.OWFEED_SIGN_KEY }}
          # opkg verifies usign, apk verifies EC. A feed serving both lines needs both.
          OWFEED_USIGN_KEY: ${{ secrets.OWFEED_USIGN_KEY }}
        run: |
          owfeed sign
          owfeed index
          ./tools/check-tree.sh
          owfeed smoke
          owfeed smoke --release 24.10
          # Compare what is about to go out against what is already live, before it
          # replaces it. A version republished with different contents is invisible
          # from inside the tree, which is self-consistent either way.
          owfeed verify out || true
          owfeed publish

      # include-hidden-files: from v4 this action excludes dotfiles, and `.nojekyll`
      # is a dotfile. Without it Pages runs Jekyll over a tree of binaries and drops
      # every path beginning with a dot or an underscore -- from a tree that was
      # correct when owfeed checked it. `owfeed verify` reports OWF514 when the live
      # site has lost it.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
