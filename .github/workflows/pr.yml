name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

# owfeed is pinned by commit, not tracked at @main. This repository signs what it
      # publishes; the tool that does the signing should move when someone changes
      # this line, not whenever an unrelated repository is pushed to.
      - run: GOPROXY=direct go install github.com/VizzleTF/owfeed/cmd/owfeed@7d977850212ed28d3d0a87bc35a297d45dfafd24

      - name: Fetch upstream artifacts
        run: for f in packages/*/fetch.sh; do "$f"; done

      # A throwaway key, so a pull request from a fork exercises the whole pipeline
      # -- build, sign, index, check -- without the feed's key being anywhere near it.
      # What this cannot prove is that the real key still works; that is what the
      # publish job is for.
      - name: Build and check with a throwaway key
        run: |
          owfeed keygen -o "$RUNNER_TEMP/throwaway.pem"
          export OWFEED_SIGN_KEY="$(cat "$RUNNER_TEMP/throwaway.pem")"
          owfeed --frozen-lock build
          owfeed sign
          owfeed index
          owfeed doctor
          # The last gate, and the only one that asks apk rather than telling it:
          # install the feed on a real OpenWrt image, following the published
          # snippet, and prove `apk add` needs no --allow-untrusted.
          owfeed smoke
          shred -u "$RUNNER_TEMP/throwaway.pem"
