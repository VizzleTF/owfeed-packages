name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A package's identity is a hash over its payload, and mkpkg records mtimes. Without
  # a fixed epoch every rebuild produces a new identity for byte-identical content, so
  # each republication ships packages that claim to be new, invalidating every cached
  # copy and making `owfeed verify` report tampering that did not happen.
  #
  # A constant, not a timestamp: identity should depend on what a package contains and
  # on nothing else. Content changes only when a pin changes, and a pin change comes
  # with a version bump.
  SOURCE_DATE_EPOCH: '1700000000'


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # owfeed is pinned to a release, not tracked at @main. This repository signs
      # what it publishes; the tool that does the signing should move when someone
      # changes this line, not whenever an unrelated repository is pushed to.
      #
      # The action verifies the binary against the attestation from owfeed's release
      # workflow before running it, which `go install` does not do -- it trusts
      # whatever the module proxy hands back for that revision.
      - uses: VizzleTF/owfeed/setup@v0.1.4
        with:
          version: v0.1.4

      - name: Fetch upstream artifacts
        run: for d in packages/*/; do ./tools/fetch.sh "$d"; done

      # A throwaway key, so a pull request from a fork exercises the whole pipeline
      # -- build, sign, index, check -- without the feed's key being anywhere near it.
      # What this cannot prove is that the real key still works; that is what the
      # publish job is for.
      - name: Build and check with a throwaway key
        run: |
          owfeed keygen -o "$RUNNER_TEMP/throwaway.pem"
          owfeed keygen --usign -o "$RUNNER_TEMP/throwaway.sec"
          export OWFEED_SIGN_KEY="$(cat "$RUNNER_TEMP/throwaway.pem")"
          export OWFEED_USIGN_KEY="$(cat "$RUNNER_TEMP/throwaway.sec")"
          owfeed --frozen-lock build
          owfeed sign
          owfeed index
          ./tools/check-tree.sh
          owfeed doctor --require-origin
          # The last gate, and the only one that asks apk rather than telling it:
          # install the feed on a real OpenWrt image, following the published
          # snippet, and prove `apk add` needs no --allow-untrusted.
          owfeed smoke
          owfeed smoke --release 24.10
          shred -u "$RUNNER_TEMP/throwaway.pem" "$RUNNER_TEMP/throwaway.sec"
